# Development stack with hot reload: docker compose up --build
# Source code is bind-mounted, so edits apply without rebuilding. Rebuild only
# when Python dependencies change (pyproject.toml / uv.lock).
#   frontend  http://localhost:5173  (Vite; proxies /api to the backend)
#   backend   http://localhost:8000  (Django runserver)
x-backend: &backend
  image: shop-backend:dev  # built once, shared by backend/worker/beat
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    target: dev
  env_file: .env  # all configuration and secrets; see .env.example
  depends_on:
    redis: { condition: service_healthy }
  volumes:
    - .:/app

services:
  # The only backing store: cache (forecasts) and Celery broker.
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s

  # Celery has no auto-reload: watchfiles restarts it when a .py file changes.
  worker:
    <<: *backend
    command: python -m watchfiles --filter python "celery -A config worker -l info --concurrency 2" apps config

  beat:
    <<: *backend
    command: python -m watchfiles --filter python "celery -A config beat -l info --schedule /tmp/celerybeat-schedule" apps config

  frontend:
    image: shop-frontend:dev
    build:
      context: frontend
      target: dev
    env_file: .env  # GOOGLE_MAPS_API_KEY, BACKEND_URL
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the container's node_modules, not the host's
    depends_on: [backend]
