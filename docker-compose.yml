# Local stack: docker compose up --build
x-app: &app
  image: shop:local  # built once, shared by web/worker/beat
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env.docker
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  volumes:
    - media:/app/media

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
    expose: ["8000"]
    volumes:
      - media:/app/media
      - static:/app/staticfiles  # populated from the image, shared with nginx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s

  worker:
    <<: *app
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *app
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    depends_on: [web]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro

  mailpit:  # catches all outgoing email: UI at http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  pgdata:
  media:
  static:
