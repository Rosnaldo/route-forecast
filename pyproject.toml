[project]
name = "shop"
version = "0.1.0"
description = "Django API base: DRF, Redis, Celery, Docker, AWS."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.1",
    "djangorestframework>=3.16",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "uvicorn[standard]>=0.34",
    "uvicorn-worker>=0.3",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "boto3>=1.37",
    "django-storages[s3]>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["config/asgi.py", "config/wsgi.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
