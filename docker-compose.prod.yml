# Production stack:  docker compose -f docker-compose.prod.yml up -d --build
#
# CloudFront terminates HTTPS and forwards to this server over plain HTTP on WEB_PORT.
# Only `web` is published: nginx serves the React app and proxies /api/, /static/ and
# /health/ to Django. Redis and the backend are reachable only inside the stack.
#
# Configuration comes from `.env` next to this file (see .env.example): it is read by
# the containers (env_file) and for the ${...} values below.
x-backend: &backend
  image: shop-backend:prod  # built once, shared by backend/worker/beat
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    target: runtime  # DJANGO_SETTINGS_MODULE=config.settings.prod
  env_file: .env
  restart: unless-stopped
  depends_on:
    redis: { condition: service_healthy }

services:
  # Cache (forecasts, trips) and Celery broker. Nothing worth keeping on disk; when full,
  # it evicts keys that expire anyway (volatile-lru), never Celery's queue (no expiry).
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      start_period: 20s

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-2}

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  web:
    image: shop-frontend:prod
    build:
      context: frontend
      target: runtime
      args:
        # Browser key, baked into the bundle (public by nature; restrict it by referrer).
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports: ["${WEB_PORT:-80}:80"]  # CloudFront's origin
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
