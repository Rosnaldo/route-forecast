# Production stack:  docker compose -f docker-compose.prod.yml up -d --build
#
# Nothing is published: the server's central proxy (proxy-hostinger, ports 80/443,
# TLS) reaches the backend over the external `edge` network as `forecast-backend` and
# proxies /backend/, /static/ and /health/ to it (nginx/prod/https/nginx.conf). Redis
# is reachable only inside the stack. The React app is not part of this stack: it is deployed to S3 behind
# CloudFront (deploy_web_s3.sh), and CloudFront forwards the API paths here.
#
# Every service is prefixed with forecast- so names never clash on `edge`. Inside this
# stack each one also keeps its short name (redis, backend) as an alias on `default`
# only, which is what .env uses (REDIS_URL, BACKEND_URL).
#
# Configuration comes from `.env` next to this file (see .env.example): it is read by
# the containers (env_file) and for the ${...} values below.
services:
  # Cache (forecasts, trips). Nothing worth keeping on disk; when full, it evicts the
  # keys closest to expiring anyway (volatile-lru).
  forecast-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      default:
        aliases: [redis]

  forecast-backend:
    image: shop-backend:prod
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime  # DJANGO_SETTINGS_MODULE=config.settings.prod
    env_file: .env
    restart: unless-stopped
    depends_on:
      forecast-redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      start_period: 20s
    networks:
      default:
        aliases: [backend]
      edge:

networks:
  # Shared with the central proxy; created once with `docker network create edge`.
  edge:
    external: true
