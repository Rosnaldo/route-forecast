# NOTE: GitHub only reads workflows from the repository root's .github/.
# This project lives in a subfolder of my-study, so either move this file to
# <repo>/.github/workflows/ (keeping `working-directory`) or make django-test its own repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: django-test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: django-test/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django-test/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: django-test/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The production image must build on every change.
  docker:
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: django-test
          file: django-test/docker/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
