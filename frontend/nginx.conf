server {
    listen 80;
    root /usr/share/nginx/html;

    # Compress the app's text files (HTML is compressed by default).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed bundle files never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html. /api is routed to the
    # backend by the load balancer (ALB / Ingress), not by this container.
    location / {
        try_files $uri /index.html;
    }
}
