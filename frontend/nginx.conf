# The viewer's protocol for Django: CloudFront sends it as CloudFront-Forwarded-Proto
# (when its origin request policy forwards that header); else keep X-Forwarded-Proto.
map $http_cloudfront_forwarded_proto $forwarded_proto {
    ""      $http_x_forwarded_proto;
    default $http_cloudfront_forwarded_proto;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Compress the app's text files (HTML is compressed by default). Responses from
    # Django are not touched (gzip_proxied is off): Django compresses its own.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's DNS, re-asked every 10 s: `backend` keeps resolving after it restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Django: the API (including the weather event stream), its static files (API docs)
    # and the health check.
    location ~ ^/(api|static|health)/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The weather stream sends X-Accel-Buffering: no, so nginx passes each event on
        # at once; other responses are buffered as usual.
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # Hashed bundle files never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
