# Development reverse proxy (docker-compose.yml, service `nginx`).
# A template: the nginx image fills ${BASE_DOMAIN} from nginx/.env.dev at startup
# (envsubst only replaces variables that are set, so nginx's own $vars are kept).

server {
    listen 80;
    server_name ${BASE_DOMAIN} www.${BASE_DOMAIN};
    return 301 https://$host$request_uri;  # all HTTP goes to HTTPS
}

server {
    listen 443 ssl;
    server_name ${BASE_DOMAIN} www.${BASE_DOMAIN};

    # Made with mkcert (see nginx/README.md).
    ssl_certificate /etc/nginx/certs/${BASE_DOMAIN}.pem;
    ssl_certificate_key /etc/nginx/certs/${BASE_DOMAIN}-key.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's DNS, re-asked every 10 s: services keep resolving after they restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:5173;

    # Django: the API under /backend/ (including the weather event stream), its static
    # files (API docs) and the health check.
    location ~ ^/(backend|static|health)/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The weather stream sends X-Accel-Buffering: no, so nginx passes each event on
        # at once; other responses are buffered as usual.
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # React app: the Vite dev server, proxied (not built) so hot reload works over
    # its websocket.
    location / {
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
