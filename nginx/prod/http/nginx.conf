# Production, port 80 (docker-compose.prod.yml, service `nginx-http`).
# Answers Let's Encrypt's HTTP challenge for certbot and sends everything else to
# HTTPS. A template: ${BASE_DOMAIN} comes from nginx/.env.prod.

server {
    listen 80;
    server_name ${BASE_DOMAIN} www.${BASE_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
