# Production, port 443 (docker-compose.prod.yml, service `nginx-https`).
# Terminates TLS with the Let's Encrypt certificate from certbot, proxies /api/,
# /static/ and /health/ to Django and serves the React bundle, which the image
# (frontend/Dockerfile, runtime stage) has in /usr/share/nginx/html.
# A template: ${BASE_DOMAIN} comes from nginx/.env.prod.

server {
    listen 443 ssl;
    server_name ${BASE_DOMAIN} www.${BASE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's DNS, re-asked every 10 s: services keep resolving after they restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;

    # Compress the app's text files (HTML is compressed by default). Responses from
    # Django are not touched (gzip_proxied is off): Django compresses its own.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Django: the API (including the weather event stream), its static files (API docs)
    # and the health check.
    location ~ ^/(api|static|health)/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The weather stream sends X-Accel-Buffering: no, so nginx passes each event on
        # at once; other responses are buffered as usual.
        proxy_read_timeout 120s;
        client_max_body_size 1m;
    }

    # Hashed bundle files never change: cache them for a year. add_header here
    # replaces the server's headers, so the security headers are repeated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri /index.html;
    }
}
